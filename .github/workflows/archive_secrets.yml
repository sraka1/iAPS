# .github/workflows/archive_secrets.yml
name: Archive secrets

on:
  workflow_dispatch: {}

jobs:
  archive-secrets:
    runs-on: ubuntu-latest

    env:
      TEAMID: ${{ secrets.TEAMID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      ARCHIVE_SECRET: ${{ secrets.ARCHIVE_SECRET }}

    steps:
      - name: Build encrypted archive in-memory and write .enc only
        run: |
          python - <<'PY'
          import os, io, tarfile, time, subprocess, sys

          # 1) refuse to run if we can't encrypt
          archive_secret = os.environ.get("ARCHIVE_SECRET")
          if not archive_secret:
              print("ERROR: ARCHIVE_SECRET is not set. Aborting before dumping secrets.", file=sys.stderr)
              sys.exit(1)

          # 2) these are the ONLY secrets we dump
          secrets_to_dump = [
              "TEAMID",
              "FASTLANE_ISSUER_ID",
              "FASTLANE_KEY_ID",
              "FASTLANE_KEY",
              "GH_PAT",
              "MATCH_PASSWORD",
          ]

          # 3) create a tar.gz fully in memory
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w:gz") as tar:
              now = int(time.time())
              for name in secrets_to_dump:
                  val = os.environ.get(name)
                  if not val:
                      continue
                  data = val.encode("utf-8")
                  info = tarfile.TarInfo(name=f"secret-dump/{name}.txt")
                  info.size = len(data)
                  info.mtime = now
                  tar.addfile(info, io.BytesIO(data))

          tar_bytes = buf.getvalue()  # unencrypted archive stays in memory only

          # 4) run openssl, feeding tar via stdin, password via env
          #    -> no secret on CLI, no unencrypted file on disk
          with open("secret-archive.tar.gz.enc", "wb") as out_f:
              subprocess.run(
                  [
                      "openssl", "enc",
                      "-aes-256-cbc",
                      "-pbkdf2",
                      "-salt",
                      "-pass", "env:ARCHIVE_SECRET",
                  ],
                  input=tar_bytes,
                  stdout=out_f,
                  check=True,
                  env={**os.environ, "ARCHIVE_SECRET": archive_secret},
              )
          PY

      - name: Upload encrypted archive
        uses: actions/upload-artifact@v4
        with:
          name: secret-archive
          path: secret-archive.tar.gz.enc
          retention-days: 1
